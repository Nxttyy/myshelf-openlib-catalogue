<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan books · Dora</title>
    <meta name="theme-color" content="#0E0D0B">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/mobile-scan.css?v={{ static_version }}">
</head>
<body>
    <div class="header">
        <h1><svg class="mark" width="28" height="28" viewBox="-8 -2 104 104" aria-hidden="true"><g stroke="currentColor" stroke-width="4" stroke-linejoin="round"><rect x="17" y="14" width="15.8" height="72" rx="1.5" fill="currentColor"/><path d="M32.00 38.00 L32.00 12.00 A38 38 0 0 1 48.90 15.96 L37.34 39.25 A12 12 0 0 0 32.00 38.00 ZM39.45 40.60 L55.60 20.22 A38 38 0 0 1 66.38 33.82 L42.86 44.89 A12 12 0 0 0 39.45 40.60 ZM42.86 55.11 L66.38 66.18 A38 38 0 0 1 55.60 79.78 L39.45 59.40 A12 12 0 0 0 42.86 55.11 ZM37.34 60.75 L48.90 84.04 A38 38 0 0 1 32.00 88.00 L32.00 62.00 A12 12 0 0 0 37.34 60.75 Z" fill="currentColor"/></g><path d="M43.68 47.26 L69.00 41.32 A38 38 0 0 1 69.00 58.68 L43.68 52.74 A12 12 0 0 0 43.68 47.26 Z" fill="#E8673F" stroke="#E8673F" stroke-width="4" stroke-linejoin="round" transform="translate(5 -1) rotate(-8 32 50)"/></svg>Scan books</h1>
        <div class="count-badge" id="scan-count">0</div>
    </div>
    <div id="reader-wrap">
        <div id="reader"></div>
        <p class="hint">Point your camera at a book barcode to scan it.</p>
    </div>
    <div class="scanned-list" id="scanned-list"></div>
    <div class="done-bar">
        <strong id="done-label">Switch back to your desktop</strong>
        Books will appear in the desktop queue automatically.
    </div>
    <div class="toast" id="toast"></div>
    <script>const TOKEN = "{{ token }}";</script>
    <script src="/static/js/mobile-scan.js?v={{ static_version }}"></script>
</body>
</html>
