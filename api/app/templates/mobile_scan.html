<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan Books — Dora</title>
    <link rel="stylesheet" href="/static/css/mobile-scan.css?v={{ static_version }}">
</head>
<body>
    <div class="header">
        <h1>Scan Books</h1>
        <div class="count-badge" id="scan-count">0</div>
    </div>
    <div id="reader-wrap">
        <div id="reader"></div>
        <p class="hint">Point your camera at a book barcode to scan it.</p>
    </div>
    <div class="scanned-list" id="scanned-list"></div>
    <div class="done-bar">
        <strong id="done-label">Switch back to your desktop</strong>
        Books will appear in the desktop queue automatically.
    </div>
    <div class="toast" id="toast"></div>
    <script>const TOKEN = "{{ token }}";</script>
    <script src="/static/js/mobile-scan.js?v={{ static_version }}"></script>
</body>
</html>
