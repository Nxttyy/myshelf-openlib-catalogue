<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Dora</title>
<link rel="stylesheet" href="/static/css/fonts.css?v={{ static_version }}">
<link rel="stylesheet" href="/static/css/register.css?v={{ static_version }}">
</head>
<body>
<div class="page">
  <div class="band">
    <a href="/" class="band-logo">
      <span class="band-logo-mark">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.4v13.2"/><path d="M16 5.4v13.2"/><ellipse cx="12" cy="5.4" rx="4" ry="2"/><path d="M10.6 5.6a1.4 0.8 0 0 1 2.8 0"/><path d="M8 18.6a4 2 0 0 0 8 0"/><path d="M7.1 11.8h9.8"/><path d="M9.7 11.8c-.5 1-.3 2.2.2 3.2"/></svg>
      </span>
      Dora
    </a>
    <div class="band-label">Create account</div>
    <h1>Start your<br>catalog<br>today.</h1>
    <p>Scan your shelf, track your reading, and build a library worth browsing.</p>
  </div>

  <div class="form-panel">
    <div class="form-inner">
      <div class="form-title">Create your account</div>

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <a href="/auth/google" class="f-btn f-btn--ghost" style="text-decoration:none;margin-bottom:4px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </a>

      <div class="divider"><span>or</span></div>

      <form action="/auth/register" method="POST">
        <div class="f-row">
          <div class="f-field">
            <label class="f-label" for="firstname">First name</label>
            <input class="f-input" type="text" id="firstname" name="firstname" placeholder="Jane" required autocomplete="given-name">
          </div>
          <div class="f-field">
            <label class="f-label" for="lastname">Last name</label>
            <input class="f-input" type="text" id="lastname" name="lastname" placeholder="Smith" autocomplete="family-name">
          </div>
        </div>
        <div class="f-field">
          <label class="f-label" for="email">Email</label>
          <input class="f-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="f-field">
          <label class="f-label" for="password">Password</label>
          <div class="pw-wrap">
            <input class="f-input" type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Toggle password">
              <svg id="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="f-btn f-btn--amber" style="margin-top:6px;">Create account</button>
      </form>

      <div class="form-links">
        <div>Already have an account? <a href="/login">Sign in</a></div>
        <div><a href="/" style="font-weight:400;color:var(--ink-faint);">← Back to app</a></div>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/register.js?v={{ static_version }}"></script>
</body>
</html>
