<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Dora</title>
<link rel="stylesheet" href="/static/css/fonts.css?v={{ static_version }}">
<link rel="stylesheet" href="/static/css/forgot-password.css?v={{ static_version }}">
</head>
<body>
<div class="card">
  <a href="/" class="logo">
    <span class="logo-mark">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.4v13.2"/><path d="M16 5.4v13.2"/><ellipse cx="12" cy="5.4" rx="4" ry="2"/><path d="M10.6 5.6a1.4 0.8 0 0 1 2.8 0"/><path d="M8 18.6a4 2 0 0 0 8 0"/><path d="M7.1 11.8h9.8"/><path d="M9.7 11.8c-.5 1-.3 2.2.2 3.2"/></svg>
    </span>
    Dora
  </a>
  <h1 class="card-title">Forgot your password?</h1>
  <p class="card-sub">Enter your email and we'll send you a link to reset it.</p>

  {% if error %}
  <div class="form-error">{{ error }}</div>
  {% endif %}

  <form action="/auth/password-recovery" method="POST">
    <div class="f-field">
      <label class="f-label" for="email">Email</label>
      <input class="f-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>
    <button type="submit" class="f-btn f-btn--amber">Send reset link</button>
  </form>

  <div class="form-links" style="margin-top:20px;">
    <a href="/login">← Back to sign in</a>
  </div>
</div>
</body>
</html>
