<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Dora</title>
<link rel="stylesheet" href="/static/css/fonts.css?v={{ static_version }}">
<link rel="stylesheet" href="/static/css/reset-password.css?v={{ static_version }}">
</head>
<body>
<div class="card">
  <a href="/" class="logo">
    <span class="logo-mark">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.4v13.2"/><path d="M16 5.4v13.2"/><ellipse cx="12" cy="5.4" rx="4" ry="2"/><path d="M10.6 5.6a1.4 0.8 0 0 1 2.8 0"/><path d="M8 18.6a4 2 0 0 0 8 0"/><path d="M7.1 11.8h9.8"/><path d="M9.7 11.8c-.5 1-.3 2.2.2 3.2"/></svg>
    </span>
    Dora
  </a>
  <h1 class="card-title">Set a new password</h1>
  <p class="card-sub">Choose a strong password for your Dora account.</p>

  {% if error %}
  <div class="form-error">{{ error }}</div>
  {% endif %}

  <form action="/auth/reset-password" method="POST">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="f-field">
      <label class="f-label" for="password">New password</label>
      <div class="pw-wrap">
        <input class="f-input" type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Toggle password">
          <svg id="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="f-btn f-btn--amber">Reset password</button>
  </form>

  <div class="form-links">
    <a href="/login">← Back to sign in</a>
  </div>
</div>
<script src="/static/js/reset-password.js?v={{ static_version }}"></script>
</body>
</html>
